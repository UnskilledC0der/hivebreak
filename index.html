(function () {
'use strict';

/* ==================== Setup ==================== */
const W = 640, H = 760, STEP = 1000 / 60;
// The world grows in Endless. VW and VH are its size; the camera zooms out to fit it.
let zoom = 1, VW = W, VH = H, PLAYER_Y = 670, BREACH_Y = 625, TOP = 46, BAR_Y = 560;
const MIN_ZOOM = 0.6, MAX_VW = Math.ceil(W / MIN_ZOOM), MAX_VH = Math.ceil(H / MIN_ZOOM);
function setWorld(z) {
  zoom = z; VW = W / z; VH = H / z;

}
const canvas = document.getElementById('g');
const c = canvas.getContext('2d');
const FONT = '"Menlo","Consolas","Courier New",monospace';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
let renderScale = 1;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  canvas.width = Math.floor(W * s * dpr);
  canvas.height = Math.floor(H * s * dpr);
  renderScale = canvas.width / W;
}
window.addEventListener('resize', resize);
resize();

/* ==================== Save data ==================== */
const SAVE_KEY = 'hivebreak_v1';
const save = { unlocked: 1, hi: 0, stars: {}, run: null, music: true, sfx: true, shake: true, ship: 'lancer', difficulty: 'normal', autofire: false, hiEndless: 0, bestWave: 0, tutorialDone: false, notesSeen: {}, scoreV2: false, tint: 'blue', pencils: 0, perks: {}, prestiges: 0, endlessRun: null, tutorialCleared: false };
try {
  const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (raw && typeof raw === 'object') Object.assign(save, raw);
} catch (e) { /* private mode or corrupt data: play with defaults */ }
// Old best scores used the former points system and can't be compared.
if (!save.scoreV2) { save.hiEndless = 0; save.scoreV2 = true; }

  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* non-fatal */ }

/* ==================== Audio (fully synthesized) ==================== */
const A = { ctx: null, master: null, sfx: null, music: null, noise: null, next: 0, step: 0, last: {} };
function ensureAudio() {
  try {
    if (!A.ctx) {

      A.master = A.ctx.createDynamicsCompressor();
      A.master.connect(A.ctx.destination);
      A.sfx = A.ctx.createGain(); A.sfx.gain.value = save.sfx ? 0.5 : 0; A.sfx.connect(A.master);
      A.music = A.ctx.createGain(); A.music.gain.value = save.music ? 0.22 : 0; A.music.connect(A.master);

      A.noise = A.ctx.createBuffer(1, len, len);

}
function tone(o, dest) {

  g.gain.setValueAtTime(o.vol || 0.1, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);

}
function noise(o, dest) {

  const t = (o.at !== undefined ? o.at : A.ctx.currentTime) + (o.delay || 0);

  g.gain.setValueAtTime(o.vol || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);

  s.start(t, Math.random() * 0.5); s.stop(t + o.dur + 0.02);
}
function sfx(name) {
  if (!A.ctx || !save.sfx) return;
  const now = A.ctx.currentTime;
  if (A.last[name] && now - A.last[name] < 0.035) return;
  A.last[name] = now;
  const crumple = (n, spread, vol) => {
    for (let k = 0; k < n; k++) noise({ f0: rand(1200, 6500), dur: rand(0.015, 0.05), vol: vol * rand(0.6, 1), filter: 'bandpass', delay: k * spread + rand(0, spread) });
  };
  switch (name) {
    case 'shoot': noise({ f0: 4300, f1: 2300, dur: 0.045, vol: 0.14, filter: 'bandpass' }); tone({ type: 'triangle', f0: 1150, f1: 520, dur: 0.03, vol: 0.025 }); break; // pencil flick
    case 'hit': tone({ type: 'triangle', f0: 640, f1: 430, dur: 0.03, vol: 0.07 }); noise({ f0: 5200, dur: 0.02, vol: 0.05, filter: 'highpass' }); break; // tap on wood
    case 'kill': crumple(5, 0.017, 0.26); break; // paper crumple
    case 'crit': tone({ type: 'triangle', f0: 1500, f1: 1000, dur: 0.05, vol: 0.09 }); break;
    case 'hurt': noise({ f0: 700, f1: 6000, dur: 0.34, vol: 0.5, filter: 'bandpass' }); crumple(8, 0.035, 0.3); tone({ type: 'sine', f0: 130, f1: 40, dur: 0.2, vol: 0.3 }); break; // page tear
    case 'shield': tone({ type: 'sine', f0: 1500, f1: 820, dur: 0.16, vol: 0.14 }); noise({ f0: 3200, dur: 0.12, vol: 0.12, filter: 'bandpass' }); break; // eraser squeak
    case 'pickup': [660, 880, 1320].forEach((f, k) => tone({ type: 'triangle', f0: f, dur: 0.07, vol: 0.14, delay: k * 0.055 })); break; // pencils tapped together
    case 'nova': for (let k = 0; k < 16; k++) noise({ f0: k % 2 ? 2100 : 3600, f1: k % 2 ? 3600 : 2100, dur: 0.05, vol: 0.34, filter: 'bandpass', delay: k * 0.042 }); noise({ f0: 900, f1: 80, dur: 0.8, vol: 0.4 }); break; // furious scribbling
    case 'laserWarn': noise({ f0: 1700, f1: 3800, dur: 0.6, vol: 0.13, filter: 'bandpass' }); break; // pencil sharpener
    case 'laser': for (let k = 0; k < 12; k++) noise({ f0: k % 2 ? 1400 : 2400, dur: 0.05, vol: 0.2, filter: 'bandpass', delay: k * 0.048 }); tone({ type: 'triangle', f0: 95, f1: 70, dur: 0.6, vol: 0.2 }); break;
    case 'alarm': [0, 0.14, 0.28].forEach(d => tone({ type: 'sine', f0: 210, f1: 120, dur: 0.1, vol: 0.32, delay: d })); break; // knocks on the desk
    case 'bossBoom': crumple(7, 0.02, 0.3); noise({ f0: 1400, f1: 90, dur: 0.3, vol: 0.28 }); break;
    case 'bossDead': noise({ f0: 500, f1: 7000, dur: 0.9, vol: 0.55, filter: 'bandpass' }); crumple(26, 0.045, 0.36); tone({ type: 'sine', f0: 130, f1: 30, dur: 0.8, vol: 0.4 }); break;
    case 'click': noise({ f0: 4800, dur: 0.018, vol: 0.14, filter: 'highpass' }); tone({ type: 'triangle', f0: 900, dur: 0.02, vol: 0.05 }); break;
    case 'move': tone({ type: 'triangle', f0: 720, dur: 0.012, vol: 0.03 }); break;
    case 'deny': tone({ type: 'triangle', f0: 170, f1: 120, dur: 0.12, vol: 0.14 }); break;
    case 'clear': [392, 523, 659, 784, 1047].forEach((f, k) => tone({ type: 'triangle', f0: f, dur: 0.14, vol: 0.13, delay: k * 0.08 })); break;
    case 'upgrade': [659, 988, 1319].forEach((f, k) => tone({ type: 'triangle', f0: f, dur: 0.15, vol: 0.14, delay: k * 0.07 })); break;
    case 'over': crumple(12, 0.04, 0.26); [392, 330, 262, 196].forEach((f, k) => tone({ type: 'triangle', f0: f, dur: 0.3, vol: 0.14, delay: 0.3 + k * 0.22 })); break;
    case 'page': noise({ f0: 700, f1: 3800, dur: 0.22, vol: 0.26, filter: 'bandpass' }); noise({ f0: 3800, f1: 900, dur: 0.24, vol: 0.2, filter: 'bandpass', delay: 0.2 }); break;
    case 'scribble': noise({ f0: 3100, f1: 2200, dur: 0.05, vol: 0.09, filter: 'bandpass' }); noise({ f0: 2200, f1: 3100, dur: 0.05, vol: 0.09, filter: 'bandpass', delay: 0.06 }); break;

/* Procedural chiptune loop; called every frame and schedules a little ahead. */
const CHORDS = [0, 0, -4, -2], BASS = [0, 0, 12, 0, 0, 7, 0, 10], ARP = [0, 7, 12, 15, 19, 15, 12, 7];
function musicTick() {
  if (!A.ctx || A.ctx.state !== 'running') return;
  if (!save.music || mode === 'pause' || mode === 'settings' || mode === 'confirm' || mode === 'gameover') { A.next = 0; return; }
  const inGame = mode === 'play';
  const bossy = inGame && boss;
  const bpm = bossy ? 158 : inGame ? 128 + run.stage : 96;
  const sLen = 60 / bpm / 4;
  if (A.next < A.ctx.currentTime) A.next = A.ctx.currentTime + 0.05;
  const sector = run ? sectorOf(run.stage) : 0;
  const root = bossy ? 98 : [110, 87.31, 73.42, 82.41][sector];
  while (A.next < A.ctx.currentTime + 0.14) {
    const s = A.step++, t = A.next;
    const bar = Math.floor(s / 16) % 4;
    const r = root * Math.pow(2, CHORDS[bar] / 12);
    if (inGame) {
      if (s % 2 === 0) tone({ type: bossy ? 'sawtooth' : 'triangle', f0: r * Math.pow(2, BASS[(s / 2) % 8] / 12), dur: sLen * 1.7, vol: 0.3, at: t }, A.music);
      if (s % 4 === 0) tone({ type: 'sine', f0: 130, f1: 40, dur: 0.11, vol: 0.55, at: t }, A.music);
      if (s % 4 === 2) noise({ f0: 7000, dur: 0.035, vol: 0.14, filter: 'highpass', at: t }, A.music);
      if (s % 8 === 4) noise({ f0: 2200, f1: 500, dur: 0.1, vol: 0.2, at: t }, A.music);
    }
    tone({ type: 'triangle', f0: r * 4 * Math.pow(2, ARP[s % 8] / 12) * (s % 16 > 11 ? 2 : 1), dur: sLen * 0.9, vol: inGame ? 0.06 : 0.14, at: t }, A.music);
    A.next += sLen;
  }
}

/* ==================== Colored-pencil pixel art ==================== */
const RES = 3, PAD = 4, GRAPHITE = '#2b2620', PAPER = '#f4ecd8';
const INK_OVERRIDES = { '#fff': GRAPHITE, '#ffffff': GRAPHITE, '#d6ffff': '#1f5fbf', '#7df9ff': '#0f86b8', '#9fe8ff': '#2f7fd6', '#a8fbff': '#0f86b8' };
const inkCache = {};
/* Turns any color into something a pencil could leave on cream paper. */
function ink(col) {
  if (inkCache[col]) return inkCache[col];
  if (INK_OVERRIDES[col]) return (inkCache[col] = INK_OVERRIDES[col]);
  let h = col.slice(1);
  if (h.length === 3) h = h.split('').map(ch => ch + ch).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const lum = (0.3 * r + 0.59 * g + 0.11 * b) / 255;
  const mx = Math.max(r, g, b), sat = mx ? (mx - Math.min(r, g, b)) / mx : 0;
  if (sat < 0.18) return (inkCache[col] = lum > 0.75 ? '#4a4438' : GRAPHITE);
  const f = lum > 0.5 ? 0.5 / lum : 1;
  const hx = v => Math.round(v * f).toString(16).padStart(2, '0');
  return (inkCache[col] = '#' + hx(r) + hx(g) + hx(b));
}
function lighten(col, t) {
  let h = col.slice(1);
  if (h.length === 3) h = h.split('').map(ch => ch + ch).join('');
  const m = i => Math.round(parseInt(h.slice(i, i + 2), 16) * (1 - t) + 255 * t).toString(16).padStart(2, '0');
  return '#' + m(0) + m(2) + m(4);

/* Colors one pixel-art block by hand: a light wash, then diagonal strokes. */
function pencilCell(x, px, py, s, color) {
  const j = a => (Math.random() - 0.5) * a * s;

  x.globalAlpha = 0.55 + Math.random() * 0.2;
  x.beginPath();
  x.moveTo(px + j(0.1), py + j(0.1)); x.lineTo(px + s + j(0.1), py + j(0.1));
  x.lineTo(px + s + j(0.1), py + s + j(0.1)); x.lineTo(px + j(0.1), py + s + j(0.1));
  x.closePath(); x.fill();
  x.strokeStyle = color; x.lineCap = 'round';
  const n = Math.max(3, Math.round(s / 2.4));
  for (let i = 0; i < n; i++) {
    const d = (i + 0.2 + Math.random() * 0.6) / n * 2 * s;
    let x0, y0, x1, y1;
    if (d < s) { x0 = px + d; y0 = py; x1 = px; y1 = py + d; }
    else { x0 = px + s; y0 = py + d - s; x1 = px + d - s; y1 = py + s; }
    x.globalAlpha = 0.5 + Math.random() * 0.5;
    x.lineWidth = Math.max(1, s * (0.1 + Math.random() * 0.1));
    x.beginPath(); x.moveTo(x0 + j(0.12), y0 + j(0.12)); x.lineTo(x1 + j(0.12), y1 + j(0.12)); x.stroke();
  }

}
/* Paints rows of palette letters, lets paper tooth show through, then outlines by hand. */
function paintRows(x, rows, pal, s, ox, oy, outline) {
  const filled = (cx, cy) => rows[cy] && rows[cy][cx] && rows[cy][cx] !== '.';
  rows.forEach((row, cy) => row.split('').forEach((ch, cx) => {
    if (ch !== '.') pencilCell(x, ox + cx * s, oy + cy * s, s, pal[ch]);
  }));
  const w = rows[0].length * s, h = rows.length * s;
  x.save();
  x.globalCompositeOperation = 'destination-out';
  const specks = w * h / 14;
  for (let i = 0; i < specks; i++) {
    x.globalAlpha = 0.2 + Math.random() * 0.4;
    x.fillRect(ox + Math.random() * w, oy + Math.random() * h, 1 + Math.random() * 1.5, 1 + Math.random() * 1.5);
  }
  x.restore();
  if (outline === false) return;
  x.strokeStyle = GRAPHITE; x.lineCap = 'round';
  x.lineWidth = Math.max(1.5, s * 0.14);
  const j = () => (Math.random() - 0.5) * s * 0.12;

    x.globalAlpha = 0.6 + Math.random() * 0.35;
    x.beginPath(); x.moveTo(a + j(), b + j()); x.lineTo(c + j(), d + j()); x.stroke();
  };
  rows.forEach((row, cy) => row.split('').forEach((ch, cx) => {
    if (ch === '.') return;
    const l = ox + cx * s, t = oy + cy * s;
    if (!filled(cx, cy - 1)) edge(l, t, l + s, t);
    if (!filled(cx, cy + 1)) edge(l, t + s, l + s, t + s);
    if (!filled(cx - 1, cy)) edge(l, t, l, t + s);

  paintRows(full.getContext('2d'), rows, pal, scale * RES, PAD * RES, PAD * RES);
  const flash = document.createElement('canvas');
  flash.width = full.width; flash.height = full.height;
  const fl = flash.getContext('2d');
  fl.drawImage(full, 0, 0);

function makeSprite(half, pal, scale) {

}
function drawS(s, x, y, flash) {
  c.drawImage(flash ? s.flash : s.img, Math.round(x - s.w / 2) - PAD, Math.round(y - s.h / 2) - PAD, s.w + PAD * 2, s.h + PAD * 2);

/* Round pixel tokens: shots, pickups and boss cores. */
const orbCache = {};
function orb(color, r) {

  return (orbCache[k] = o);

/* ==================== Main loop (fixed 60 Hz step, any display rate) ==================== */
let lastT = 0, acc = 0;
function frame(now) {
  if (!lastT) lastT = now;
  acc += Math.min(now - lastT, 100);
  lastT = now;
  let n = 0;
  while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; }
  render();
  try { musicTick(); } catch (e) { /* audio must never stop the game */ }
  requestAnimationFrame(frame);
}
setMode('title');
requestAnimationFrame(frame);
